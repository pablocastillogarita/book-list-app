<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis libros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2F45A8">
<meta name="apple-mobile-web-app-title" content="Mis libros">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600&display=swap">
<style>
/* Layout: pestañas (Inicio, Libros, Autores, Géneros) como la app de presupuesto; fichas de libro que abren un detalle desde abajo. */
:root {
  --bg: #F3F4F8; --surface: #FFFFFF; --ink: #1B1F2A; --muted: #5D6474; --line: #DADEE8; --soft: #E9ECF4;
  --accent: #2F45A8; --accent-ink: #FFFFFF; --accent-soft: #E6E9F7;
  --ok: #1F7A4D; --ok-soft: #E1F2E9; --off: #8A90A0;
  --d1: #2E8A57; --d2: #6B9E2F; --d3: #C28A12; --d4: #CC6A2B; --d5: #B8434A;
  --scrim: rgba(12, 16, 30, .5);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-book: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141B; --surface: #1A1D27; --ink: #E8EAF0; --muted: #A0A6B6; --line: #2C303D; --soft: #222634;
    --accent: #9FB0FF; --accent-ink: #11152A; --accent-soft: #252C4D;
    --ok: #6FD3A0; --ok-soft: #173326; --off: #6B7182;
    --d1: #5FC08A; --d2: #A3CF5F; --d3: #E3B341; --d4: #E8935A; --d5: #E2777D;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141B; --surface: #1A1D27; --ink: #E8EAF0; --muted: #A0A6B6; --line: #2C303D; --soft: #222634;
  --accent: #9FB0FF; --accent-ink: #11152A; --accent-soft: #252C4D;
  --ok: #6FD3A0; --ok-soft: #173326; --off: #6B7182;
  --d1: #5FC08A; --d2: #A3CF5F; --d3: #E3B341; --d4: #E8935A; --d5: #E2777D;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1100px; margin: 0 auto; padding-block: 20px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font: 800 clamp(28px, 5vw, 40px)/1 var(--f-display); margin: 0; letter-spacing: -.02em; }
h1 small { display: block; font: 500 13px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
h2 { font: 600 20px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0; font-weight: 600; color: var(--muted); }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 8px 12px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
nav.tabs button {
  font-weight: 600; font-size: 14px; color: var(--muted); background: none; border: 0;
  border-bottom: 3px solid transparent; padding: 10px 14px; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .n { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

/* Inicio */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; text-align: left; }
button.tile:hover { border-color: var(--accent); }
.tile .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tile .v { font: 800 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }
.progress { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 40px; gap: 10px; align-items: center; background: none; border: 0; padding: 2px 0; text-align: left; border-radius: 6px; }
.bar:hover .lbl { color: var(--accent); text-decoration: underline; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 14px; background: var(--soft); border-radius: 4px; overflow: hidden; display: flex; }
.bar .track i { display: block; height: 100%; }
.bar .track i.own { background: var(--ok); }
.bar .track i.rest { background: var(--accent); opacity: .35; }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-own::before { background: var(--ok); }
.legend .l-rest::before { background: var(--accent); opacity: .35; }
.pick { display: grid; gap: 6px; }
.pick .t { font: 600 22px/1.25 var(--f-book); }
.pick .a { color: var(--muted); }
.pick-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Libros */
.filters-card { display: grid; gap: 10px; }
.search { width: 100%; font-size: 16px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.filters label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
select { font-size: 14px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 220px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.list { display: grid; }
.row {
  display: grid; gap: 4px 20px; align-items: start; text-align: left; width: 100%;
  grid-template-columns: minmax(0, 1fr) 180px 92px 92px 70px;
  padding: 14px 8px; border: 0; border-bottom: 1px solid var(--line); background: none; border-radius: 0;
}
.row:hover { background: var(--surface); }
.head { padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.head:hover { background: none; }
.sort { background: none; border: 0; padding: 2px 0; font-size: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; font-weight: 600; }
.sort:hover { color: var(--accent); }
.sort.active { color: var(--accent); }
.sort.active::after { content: " ↑"; }
.sort.active.desc::after { content: " ↓"; }
.book { min-width: 0; }
.book .t { font: 600 1.06rem/1.3 var(--f-book); }
.book .a { color: var(--muted); font-size: 13px; }
.book .trata { margin-top: 4px; font-size: 13px; color: var(--muted); max-width: 65ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.dif { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-size: 13px; }
.dots { display: flex; gap: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--soft); }
.dot.on { background: var(--dc, var(--accent)); }
.len { font-size: 13px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; justify-self: start; }
.badge.si { background: var(--ok-soft); color: var(--ok); }
.badge.no { color: var(--off); border: 1px solid var(--line); font-weight: 500; }
.mlabel { display: none; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* Autores y géneros */
.alist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.aitem { display: grid; gap: 2px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.aitem:hover { border-color: var(--accent); }
.aitem .name { font-weight: 600; }
.aitem .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.aitem .mini { height: 5px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 6px; }
.aitem .mini i { display: block; height: 100%; background: var(--ok); }

/* Detalle */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: min(560px, 100%); max-height: 88vh; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); justify-self: center; }
.sheet .t { font: 600 26px/1.2 var(--f-book); margin: 0; text-wrap: balance; }
.sheet .a { color: var(--muted); font-size: 15px; background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
.fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.sheet p { margin: 0; font-size: 15px; line-height: 1.6; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Palabras */
.top-actions { display: flex; gap: 8px; }
.pal-sec { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.pal-sec h3 .pal-n { font-weight: 500; }
.pal-form { display: grid; gap: 8px; }
.pal-row { display: flex; gap: 8px; }
.pal-row .search { flex: 1; min-width: 0; }
.pal-mas summary { font-size: 13px; color: var(--accent); cursor: pointer; padding: 2px 0; }
.pal-mas textarea, .pal-campo input { width: 100%; margin-top: 6px; font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); resize: vertical; }
.pal-lbl { display: grid; gap: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.pal-form, .pal-lbl, .pal-sec, .pal { min-width: 0; }
.pal-lbl select { width: 100%; max-width: 100%; text-overflow: ellipsis; }
#v-palabras .filters select { max-width: 100%; }
.pal-msg { font-size: 14px; color: var(--muted); min-height: 0; }
.pal-msg:empty { display: none; }
.pal-list, .pal-grid { display: grid; gap: 10px; }
.pal-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start; }
.pal { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; transition: border-color .3s, box-shadow .3s; }
.pal-grid .pal, .pal-nueva .pal { background: var(--surface); }
.pal.nuevo { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pal-w { margin: 0; font: 600 20px/1.2 var(--f-book); }
.pal-del { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.pal-del:hover, .pal-del.seguro { color: var(--d5); }
.pal-del.seguro { font-weight: 600; }
.pal-libro { justify-self: start; background: none; border: 0; padding: 0; font-size: 12px; color: var(--accent); text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.pal-defs { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; }
.pal-defs li::marker { color: var(--muted); }
.pal-tipo { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; }
.pal-ej { display: block; margin-top: 2px; font-style: italic; color: var(--muted); font-size: 14px; }
.pal-ej::before { content: "Ej.: "; font-style: normal; }
.sheet p.pal-nota, .pal-nota { margin: 0; font-size: 13px; color: var(--muted); }
.sheet p.pal-frase, .pal-frase { margin: 0; font-size: 13px; color: var(--muted); font-family: var(--f-book); border-left: 3px solid var(--line); padding-left: 8px; }
.pal-vacio { margin: 0; font-size: 14px; color: var(--muted); }
.sheet p.pal-sync, .pal-sync { margin: 0; font-size: 12px; color: var(--muted); }
.pal-sync:empty { display: none; }
.pal-sync[data-tipo="err"] { color: var(--d5); }
.pal-sync[data-tipo="ok"]::before { content: "✓ "; color: var(--ok); }
.pal-campo { display: grid; gap: 2px; font-weight: 600; font-size: 14px; }
.pal-campo input { margin-top: 2px; }
.sheet p.pal-ayuda, .pal-ayuda { margin: -6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.pal-ayuda a { color: var(--accent); }
.pal-check { display: flex; gap: 8px; align-items: center; font-size: 14px; }

@media (max-width: 820px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .head { display: none; }
  .row { grid-template-columns: 1fr auto; gap: 8px 12px; padding: 14px 4px; }
  .book { grid-column: 1; grid-row: 1; }
  .c-state { grid-column: 2; grid-row: 1; }
  .c-tags { grid-column: 1 / -1; }
  .c-meta { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center; }
  select { max-width: 100%; }
  .filters label { flex: 1 1 140px; }
}
@media (min-width: 821px) { .c-meta { display: contents; } }
@media (max-width: 480px) {
  nav.tabs { gap: 0; }
  nav.tabs button { padding: 10px 8px; font-size: 13px; flex: 1 1 auto; }
  nav.tabs .n { display: none; }
  .bar { grid-template-columns: 90px minmax(0, 1fr) 34px; }
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><small>Biblioteca personal</small>Mis libros</h1>
    <div class="top-actions">
      <button class="btn" id="btn-ajustes" type="button" title="Ajustes de palabras"><span aria-hidden="true">⚙️</span> Ajustes</button>
      <button class="btn" id="btn-theme" type="button"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="inicio">Inicio</button>
    <button type="button" role="tab" data-tab="libros">Libros<span class="n" id="n-libros"></span></button>
    <button type="button" role="tab" data-tab="autores">Autores<span class="n" id="n-autores"></span></button>
    <button type="button" role="tab" data-tab="generos">Géneros<span class="n" id="n-generos"></span></button>
    <button type="button" role="tab" data-tab="palabras">Palabras<span class="n" id="n-palabras"></span></button>
  </nav>

  <!-- Inicio -->
  <section id="v-inicio" hidden>
    <div style="display:grid;gap:18px">
      <div class="tiles" id="tiles"></div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
          <h2>Cuántos tengo</h2><span class="count" id="own-pct"></span>
        </div>
        <div class="progress"><i id="own-bar"></i></div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2>Por dificultad</h2>
          <div class="legend"><span class="l-own">Lo tengo</span><span class="l-rest">Me falta</span></div>
          <div class="bars" id="by-dif"></div>
        </div>
        <div class="card">
          <h2>Por extensión</h2>
          <div class="legend"><span class="l-own">Lo tengo</span><span class="l-rest">Me falta</span></div>
          <div class="bars" id="by-largo"></div>
        </div>
      </div>
      <div class="grid2">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
            <h2>Géneros principales</h2><button class="linkbtn" type="button" data-go="generos">Ver todos</button>
          </div>
          <div class="bars" id="by-gen"></div>
        </div>
        <div class="card">
          <h3>¿Qué leo ahora?</h3>
          <div class="pick" id="pick"></div>
          <label class="filters" style="gap:6px"><span style="font-size:13px;color:var(--muted)">Elegir entre</span>
            <select id="pick-from">
              <option value="si">Los que tengo</option>
              <option value="no">Los que me faltan</option>
              <option value="">Todos</option>
            </select>
          </label>
          <div class="pick-actions">
            <button class="btn primary" type="button" id="pick-again">Otro al azar</button>
            <button class="btn" type="button" id="pick-open">Ver detalle</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Libros -->
  <section id="v-libros" hidden>
    <div style="display:grid;gap:12px">
      <div class="card filters-card">
        <input class="search" id="q" type="search" placeholder="Buscar por título, autor o de qué trata…" aria-label="Buscar">
        <div class="filters">
          <label for="f-genero">Género<select id="f-genero"></select></label>
          <label for="f-dif">Dificultad<select id="f-dif"></select></label>
          <label for="f-largo">Extensión<select id="f-largo"></select></label>
          <label for="f-tengo">Lo tengo<select id="f-tengo">
            <option value="">Todos</option><option value="si">Sí</option><option value="no">No</option>
          </select></label>
          <label for="f-orden">Ordenar por<select id="f-orden">
            <option value="autor-asc">Autor (A–Z)</option>
            <option value="autor-desc">Autor (Z–A)</option>
            <option value="titulo-asc">Título (A–Z)</option>
            <option value="titulo-desc">Título (Z–A)</option>
            <option value="genero-asc">Género (A–Z)</option>
            <option value="genero-desc">Género (Z–A)</option>
            <option value="dif-asc">Más fácil primero</option>
            <option value="dif-desc">Más difícil primero</option>
            <option value="largo-asc">Más corto primero</option>
            <option value="largo-desc">Más largo primero</option>
            <option value="tengo-desc">Los que tengo primero</option>
            <option value="tengo-asc">Los que me faltan primero</option>
          </select></label>
          <button class="linkbtn" id="reset" type="button">Quitar filtros y orden</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="count" id="count" aria-live="polite"></div>
      </div>
      <div class="list">
        <div class="row head" id="head">
          <div><button type="button" class="sort" data-sort="titulo">Libro</button> · <button type="button" class="sort" data-sort="autor">Autor</button></div>
          <div><button type="button" class="sort" data-sort="genero">Género</button></div>
          <div><button type="button" class="sort" data-sort="dif">Dificultad</button></div>
          <div><button type="button" class="sort" data-sort="largo">Extensión</button></div>
          <div><button type="button" class="sort" data-sort="tengo">Lo tengo</button></div>
        </div>
        <div id="list"></div>
      </div>
    </div>
  </section>

  <!-- Autores -->
  <section id="v-autores" hidden>
    <div style="display:grid;gap:12px">
      <div class="filters">
        <input class="search" id="qa" type="search" placeholder="Buscar autor…" aria-label="Buscar autor" style="flex:1 1 220px;width:auto">
        <label for="a-orden">Ordenar por<select id="a-orden">
          <option value="n">Más libros</option>
          <option value="az">Nombre (A–Z)</option>
          <option value="own">Más tengo</option>
        </select></label>
      </div>
      <div class="alist" id="alist"></div>
    </div>
  </section>

  <!-- Géneros -->
  <section id="v-generos" hidden>
    <div class="alist" id="glist"></div>
  </section>

  <!-- Palabras -->
  <section id="v-palabras" hidden>
    <div style="display:grid;gap:12px" id="palabras-root"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title" id="sheet"></div>
</div>

<script src="libros.js"></script>
<script src="palabras.js"></script>
<script>
(function () {
  "use strict";
  var LIBROS = window.LIBROS || [];
  var LARGOS = ["Corto", "Medio", "Largo", "Muy largo"];
  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
  var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };
  var cmpEs = function (a, b) { return a.localeCompare(b, "es"); };
  var plural = function (n, s, p) { return n + " " + (n === 1 ? s : p); };

  LIBROS.forEach(function (b, i) {
    b.id = i;
    b.tags = (b.genero || "").split("/").map(function (t) { return cap(t.trim()); }).filter(Boolean);
    b._q = norm([b.titulo, b.autor, b.genero, b.trata].join(" "));
    b._largo = LARGOS.indexOf(b.largo);
  });

  // ---------- Estado (se recuerda en este navegador) ----------
  var DEF = { tab: "inicio", tema: "auto", q: "", genero: "", dif: "", largo: "", tengo: "", autor: "", orden: "autor-asc", pick: "si" };
  var S = Object.assign({}, DEF);
  try { Object.assign(S, JSON.parse(localStorage.getItem("mis-libros") || "{}")); } catch (e) {}
  function save() { try { localStorage.setItem("mis-libros", JSON.stringify(S)); } catch (e) {} }

  // ---------- Tema ----------
  function applyTheme() {
    var r = document.documentElement;
    if (S.tema === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.tema === "oscuro" ? "dark" : "light");
    var t = { auto: ["🌗", "Auto"], oscuro: ["🌙", "Oscuro"], claro: ["☀️", "Claro"] }[S.tema] || ["🌗", "Auto"];
    $("btn-theme").innerHTML = '<span aria-hidden="true">' + t[0] + "</span> " + t[1];
    $("btn-theme").title = "Tema: " + t[1] + " (tocá para cambiar)";
  }
  $("btn-theme").addEventListener("click", function () {
    S.tema = { auto: "oscuro", oscuro: "claro", claro: "auto" }[S.tema] || "auto"; save(); applyTheme();
  });

  // ---------- Datos agregados ----------
  var tengoN = LIBROS.filter(function (b) { return b.tengo; }).length;
  var autores = {};
  LIBROS.forEach(function (b) {
    var a = autores[b.autor] || (autores[b.autor] = { name: b.autor, n: 0, own: 0 });
    a.n++; if (b.tengo) a.own++;
  });
  var autoresList = Object.keys(autores).map(function (k) { return autores[k]; });
  var generos = {};
  LIBROS.forEach(function (b) {
    b.tags.forEach(function (t) { var g = generos[t] || (generos[t] = { name: t, n: 0, own: 0 }); g.n++; if (b.tengo) g.own++; });
  });
  var generosList = Object.keys(generos).map(function (k) { return generos[k]; }).sort(function (a, b) { return b.n - a.n || cmpEs(a.name, b.name); });

  $("n-libros").textContent = LIBROS.length;
  $("n-autores").textContent = autoresList.length;
  $("n-generos").textContent = generosList.length;

  // ---------- Pestañas ----------
  var TABS = ["inicio", "libros", "autores", "generos", "palabras"];
  function go(tab) {
    if (TABS.indexOf(tab) === -1) tab = "inicio";
    S.tab = tab; save();
    if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
    document.querySelectorAll("nav.tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === tab); });
    TABS.forEach(function (t) { $("v-" + t).hidden = t !== tab; });
    if (tab === "libros") renderLibros();
    if (tab === "autores") renderAutores();
    if (tab === "palabras") Palabras.renderTab($("palabras-root"));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav.tabs button").forEach(function (b) { b.addEventListener("click", function () { go(b.dataset.tab); }); });
  document.addEventListener("click", function (e) { var g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); });
  addEventListener("hashchange", function () { go(location.hash.slice(1)); });

  // Abre la pestaña Libros con un filtro puesto (y el resto limpio).
  function verLibros(f) {
    S.q = ""; S.genero = ""; S.dif = ""; S.largo = ""; S.tengo = ""; S.autor = "";
    Object.assign(S, f); syncInputs(); go("libros");
  }

  // ---------- Inicio ----------
  function tile(k, v, s, f) {
    return '<button type="button" class="tile" data-f=\'' + esc(JSON.stringify(f)) + '\'><span class="k">' + k + '</span><span class="v">' + v + '</span><span class="s">' + s + "</span></button>";
  }
  function bars(rows, total) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat(1));
    return rows.map(function (r) {
      return '<button type="button" class="bar" data-f=\'' + esc(JSON.stringify(r.f)) + '\'><span class="lbl">' + esc(r.label) +
        '</span><span class="track" style="width:' + (r.n / max * 100) + '%"><i class="own" style="width:' + (r.n ? r.own / r.n * 100 : 0) +
        '%"></i><i class="rest" style="flex:1"></i></span><span class="num">' + r.n + "</span></button>";
    }).join("");
  }
  function renderInicio() {
    var pct = LIBROS.length ? Math.round(tengoN / LIBROS.length * 100) : 0;
    $("tiles").innerHTML =
      tile("Libros", LIBROS.length, "en tu lista", {}) +
      tile("Lo tengo", tengoN, pct + "% de la lista", { tengo: "si" }) +
      tile("Me faltan", LIBROS.length - tengoN, "por conseguir", { tengo: "no" }) +
      '<button type="button" class="tile" data-go="autores"><span class="k">Autores</span><span class="v">' + autoresList.length + '</span><span class="s">distintos</span></button>';
    $("own-pct").textContent = tengoN + " de " + LIBROS.length + " · " + pct + "%";
    $("own-bar").style.width = pct + "%";
    var cnt = function (pred) { var r = LIBROS.filter(pred); return { n: r.length, own: r.filter(function (b) { return b.tengo; }).length }; };
    $("by-dif").innerHTML = bars([1, 2, 3, 4, 5].map(function (d) {
      var c = cnt(function (b) { return b.dificultad === d; });
      return { label: d + "/5", n: c.n, own: c.own, f: { dif: String(d) } };
    }));
    $("by-largo").innerHTML = bars(LARGOS.map(function (l) {
      var c = cnt(function (b) { return b.largo === l; });
      return { label: l, n: c.n, own: c.own, f: { largo: l } };
    }));
    $("by-gen").innerHTML = bars(generosList.slice(0, 8).map(function (g) {
      return { label: g.name, n: g.n, own: g.own, f: { genero: g.name } };
    }));
    $("pick-from").value = S.pick;
    nuevoAzar();
  }
  var pickId = null;
  function nuevoAzar() {
    var pool = LIBROS.filter(function (b) { return !S.pick || (S.pick === "si") === b.tengo; });
    if (!pool.length) { $("pick").innerHTML = '<span class="a">No hay libros en este grupo.</span>'; pickId = null; return; }
    var b = pool[Math.floor(Math.random() * pool.length)];
    pickId = b.id;
    $("pick").innerHTML = '<span class="t">' + esc(b.titulo) + '</span><span class="a">' + esc(b.autor) + " · " +
      (b.dificultad ? b.dificultad + "/5" : "—") + " · " + esc(b.largo || "—") + "</span>";
  }
  $("pick-again").addEventListener("click", nuevoAzar);
  $("pick-open").addEventListener("click", function () { if (pickId !== null) abrir(pickId); });
  $("pick-from").addEventListener("change", function () { S.pick = this.value; save(); nuevoAzar(); });
  $("v-inicio").addEventListener("click", function (e) {
    var el = e.target.closest("[data-f]"); if (el) verLibros(JSON.parse(el.dataset.f));
  });

  // ---------- Libros ----------
  var tagNames = generosList.map(function (g) { return g.name; }).sort(cmpEs);
  $("f-genero").innerHTML = '<option value="">Todos</option>' + tagNames.map(function (t) {
    return '<option value="' + esc(t) + '">' + esc(t) + " (" + generos[t].n + ")</option>";
  }).join("");
  $("f-dif").innerHTML = '<option value="">Todas</option>' + [1, 2, 3, 4, 5].filter(function (d) {
    return LIBROS.some(function (b) { return b.dificultad === d; });
  }).map(function (d) { return '<option value="' + d + '">' + d + "/5</option>"; }).join("");
  $("f-largo").innerHTML = '<option value="">Todas</option>' + LARGOS.map(function (l) { return '<option value="' + l + '">' + l + "</option>"; }).join("");

  var INPUTS = { q: "q", genero: "f-genero", dif: "f-dif", largo: "f-largo", tengo: "f-tengo", orden: "f-orden" };
  function syncInputs() { Object.keys(INPUTS).forEach(function (k) { $(INPUTS[k]).value = S[k]; }); }
  Object.keys(INPUTS).forEach(function (k) {
    $(INPUTS[k]).addEventListener(k === "q" ? "input" : "change", function () { S[k] = this.value; save(); renderLibros(); });
  });
  $("reset").addEventListener("click", function () {
    ["q", "genero", "dif", "largo", "tengo", "autor"].forEach(function (k) { S[k] = ""; });
    S.orden = DEF.orden; save(); syncInputs(); renderLibros();
  });
  $("chips").addEventListener("click", function (e) { if (e.target.closest("[data-clear-autor]")) { S.autor = ""; save(); renderLibros(); } });

  var DCOL = ["", "var(--d1)", "var(--d2)", "var(--d3)", "var(--d4)", "var(--d5)"];
  function difHTML(d) {
    var dots = "";
    for (var i = 1; i <= 5; i++) dots += '<span class="dot' + (i <= d ? " on" : "") + '"></span>';
    return '<span class="dif" style="--dc:' + (DCOL[d] || "var(--accent)") + '"><span class="dots" aria-hidden="true">' + dots + "</span>" + (d ? d + "/5" : "—") + "</span>";
  }
  function renderLibros() {
    var q = norm(S.q.trim());
    var res = LIBROS.filter(function (b) {
      return (!q || b._q.indexOf(q) !== -1) && (!S.genero || b.tags.indexOf(S.genero) !== -1) &&
        (!S.dif || b.dificultad === +S.dif) && (!S.largo || b.largo === S.largo) &&
        (!S.tengo || (S.tengo === "si") === b.tengo) && (!S.autor || b.autor === S.autor);
    });
    var parts = S.orden.split("-"), key = parts[0], dir = parts[1] === "desc" ? -1 : 1;
    var txt = function (k) { return function (a, b) { return cmpEs(a[k], b[k]); }; };
    var main = {
      autor: txt("autor"), titulo: txt("titulo"), genero: txt("genero"),
      dif: function (a, b) { return (a.dificultad || 0) - (b.dificultad || 0); },
      largo: function (a, b) { return a._largo - b._largo; },
      tengo: function (a, b) { return (a.tengo ? 1 : 0) - (b.tengo ? 1 : 0); }
    }[key] || txt("autor");
    res.sort(function (a, b) { return dir * main(a, b) || (key === "autor" ? txt("titulo")(a, b) : txt("autor")(a, b) || txt("titulo")(a, b)); });
    document.querySelectorAll("#head .sort").forEach(function (btn) {
      var on = btn.dataset.sort === key && S.orden !== DEF.orden;
      btn.classList.toggle("active", on); btn.classList.toggle("desc", on && dir === -1);
    });
    $("chips").innerHTML = S.autor ? '<button type="button" class="chip" data-clear-autor>Autor: ' + esc(S.autor) + ' <span aria-label="Quitar">✕</span></button>' : "";
    $("count").textContent = res.length === LIBROS.length ? "Mostrando los " + res.length + " libros" : res.length + " de " + LIBROS.length + " libros";
    if (!res.length) { $("list").innerHTML = '<p class="empty">Ningún libro coincide con estos filtros.</p>'; return; }
    $("list").innerHTML = res.map(function (b) {
      return '<button type="button" class="row" data-id="' + b.id + '">' +
        '<span class="book"><span class="t" style="display:block">' + esc(b.titulo) + '</span><span class="a">' + esc(b.autor) + "</span>" +
          (b.trata ? '<span class="trata">' + esc(b.trata) + "</span>" : "") + "</span>" +
        '<span class="c-tags tags">' + b.tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</span>" +
        '<span class="c-meta"><span>' + difHTML(b.dificultad) + '</span><span class="len">' + esc(b.largo || "—") + "</span></span>" +
        '<span class="c-state">' + (b.tengo ? '<span class="badge si">Lo tengo</span>' : '<span class="badge no">No</span>') + "</span>" +
        "</button>";
    }).join("");
  }
  $("list").addEventListener("click", function (e) { var r = e.target.closest("[data-id]"); if (r) abrir(+r.dataset.id); });
  $("head").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-sort]"); if (!btn) return;
    var k = btn.dataset.sort, cur = S.orden.split("-");
    S.orden = k + "-" + (cur[0] === k ? (cur[1] === "asc" ? "desc" : "asc") : (k === "tengo" ? "desc" : "asc"));
    save(); syncInputs(); renderLibros();
  });

  // ---------- Autores ----------
  function renderAutores() {
    var q = norm($("qa").value.trim()), o = $("a-orden").value;
    var list = autoresList.filter(function (a) { return !q || norm(a.name).indexOf(q) !== -1; });
    list.sort(o === "az" ? function (a, b) { return cmpEs(a.name, b.name); }
      : o === "own" ? function (a, b) { return b.own - a.own || b.n - a.n || cmpEs(a.name, b.name); }
      : function (a, b) { return b.n - a.n || cmpEs(a.name, b.name); });
    $("alist").innerHTML = list.length ? list.map(function (a) {
      return '<button type="button" class="aitem" data-autor="' + esc(a.name) + '"><span class="name">' + esc(a.name) +
        '</span><span class="meta">' + plural(a.n, "libro", "libros") + " · tengo " + a.own + '</span><span class="mini"><i style="width:' + (a.own / a.n * 100) + '%"></i></span></button>';
    }).join("") : '<p class="empty">Ningún autor coincide.</p>';
  }
  $("qa").addEventListener("input", renderAutores);
  $("a-orden").addEventListener("change", renderAutores);
  $("alist").addEventListener("click", function (e) { var a = e.target.closest("[data-autor]"); if (a) verLibros({ autor: a.dataset.autor }); });

  // ---------- Géneros ----------
  $("glist").innerHTML = generosList.map(function (g) {
    return '<button type="button" class="aitem" data-genero="' + esc(g.name) + '"><span class="name">' + esc(g.name) +
      '</span><span class="meta">' + plural(g.n, "libro", "libros") + " · tengo " + g.own + '</span><span class="mini"><i style="width:' + (g.own / g.n * 100) + '%"></i></span></button>';
  }).join("");
  $("glist").addEventListener("click", function (e) { var g = e.target.closest("[data-genero]"); if (g) verLibros({ genero: g.dataset.genero }); });

  // ---------- Detalle del libro ----------
  var lastFocus = null;
  function abrir(id) {
    var b = LIBROS[id]; if (!b) return;
    lastFocus = document.activeElement;
    $("sheet").innerHTML = '<span class="grab" aria-hidden="true"></span>' +
      '<div style="display:grid;gap:4px"><h2 class="t" id="d-title">' + esc(b.titulo) + '</h2><button type="button" class="a" data-autor="' + esc(b.autor) + '">' + esc(b.autor) + "</button></div>" +
      '<div class="tags">' + b.tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
      '<div class="facts"><div class="fact"><span class="k">Dificultad</span>' + difHTML(b.dificultad) + "</div>" +
        '<div class="fact"><span class="k">Extensión</span><span>' + esc(b.largo || "—") + "</span></div>" +
        '<div class="fact"><span class="k">Lo tengo</span>' + (b.tengo ? '<span class="badge si">Sí</span>' : '<span class="badge no">No</span>') + "</div></div>" +
      (b.trata ? "<div style=\"display:grid;gap:6px\"><h3>¿De qué trata?</h3><p>" + esc(b.trata) + "</p></div>" : "") +
      '<div id="d-palabras"></div>' +
      '<div class="sheet-actions">' + (b.epub ? '<a class="btn primary" href="' + esc(b.epub) + '" download>Descargar EPUB</a>' : "") +
        '<button type="button" class="btn" data-autor="' + esc(b.autor) + '">Más de este autor</button>' +
        '<button type="button" class="btn" id="d-close">Cerrar</button></div>';
    Palabras.montarFicha($("d-palabras"), b);
    mostrarSheet();
  }
  function mostrarSheet() {
    $("scrim").hidden = false;
    document.body.style.overflow = "hidden";
    $("d-close").focus();
  }
  function abrirAjustes() {
    lastFocus = document.activeElement;
    $("sheet").innerHTML = '<span class="grab" aria-hidden="true"></span>';
    var c = document.createElement("div"); c.style.cssText = "display:grid;gap:14px";
    $("sheet").appendChild(c); Palabras.montarAjustes(c);
    mostrarSheet();
  }
  $("btn-ajustes").addEventListener("click", abrirAjustes);
  document.addEventListener("click", function (e) { if (e.target.closest("[data-abrir-ajustes]")) abrirAjustes(); });
  function cerrar() { $("scrim").hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
  $("scrim").addEventListener("click", function (e) {
    if (e.target === $("scrim") || e.target.id === "d-close") return cerrar();
    var a = e.target.closest("[data-autor]"); if (a) { cerrar(); verLibros({ autor: a.dataset.autor }); }
  });
  addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("scrim").hidden) cerrar(); });

  // ---------- Palabras ----------
  function contarPalabras() { var n = Palabras.contar(); $("n-palabras").textContent = n || ""; }
  Palabras.onChange(function () { contarPalabras(); if (S.tab === "palabras") Palabras.repintarTab(); });
  Palabras.init({ libros: LIBROS, abrirLibro: abrir });
  contarPalabras();

  // ---------- Arranque ----------
  applyTheme(); syncInputs(); renderInicio();
  go(location.hash ? location.hash.slice(1) : S.tab);
})();
</script>
<script src="pwa.js"></script>
</body>
</html>
