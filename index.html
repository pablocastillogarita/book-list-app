<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de libros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: un catálogo de biblioteca; barra de filtros fija arriba y fichas en filas alineadas por columnas. */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --fg: #1b1f2a;
  --muted: #5d6474;
  --line: #dde0e7;
  --accent: #2f45a8;
  --accent-soft: #e6e9f7;
  --ok: #1f7a4d;
  --ok-soft: #e1f2e9;
  --off: #8a90a0;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1a1d27; --fg: #e8eaf0; --muted: #a0a6b6; --line: #2c303d;
    --accent: #9fb0ff; --accent-soft: #252c4d; --ok: #6fd3a0; --ok-soft: #173326; --off: #6b7182;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1a1d27; --fg: #e8eaf0; --muted: #a0a6b6; --line: #2c303d;
  --accent: #9fb0ff; --accent-soft: #252c4d; --ok: #6fd3a0; --ok-soft: #173326; --off: #6b7182;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-ui);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { padding-block: 36px 20px; }
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 5vw, 2.8rem);
  line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance;
}
.stats { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }

.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.toolbar .wrap { padding-block: 12px; display: grid; gap: 10px; }
.search {
  width: 100%; font: inherit; font-size: 16px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg);
}
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
select {
  font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--fg);
  padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  max-width: 220px;
}
.search:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reset {
  align-self: flex-end; font: inherit; font-size: 13px; color: var(--accent); background: none;
  border: 0; padding: 6px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

main { padding-block: 8px 48px; }
.row {
  display: grid; gap: 4px 20px; align-items: start;
  grid-template-columns: minmax(0, 1fr) 190px 92px 92px 108px;
  padding: 16px 0; border-bottom: 1px solid var(--line);
}
.head { padding: 12px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sort {
  font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit;
  background: none; border: 0; padding: 2px 0; cursor: pointer;
}
.sort:hover { color: var(--accent); }
.sort.active { color: var(--accent); font-weight: 600; }
.sort.active::after { content: " ↑"; }
.sort.active.desc::after { content: " ↓"; }
.book { min-width: 0; }
.book h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; line-height: 1.3; margin: 0; }
.author { color: var(--muted); font-size: 14px; }
.author button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.author button:hover { color: var(--accent); text-decoration: underline; }
.trata { margin: 6px 0 0; font-size: 14px; max-width: 65ch; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 999px; cursor: pointer;
  background: var(--accent-soft); color: var(--accent); border: 0;
}
.tag:hover { text-decoration: underline; }
.dots { display: flex; gap: 3px; padding-top: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--accent); }
.dot.on { background: var(--accent); }
.diflabel { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.len { font-size: 14px; }
.lenbar { display: flex; gap: 2px; margin-top: 4px; }
.lenbar i { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
.lenbar i.on { background: var(--fg); }
.state { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.badge.si { background: var(--ok-soft); color: var(--ok); }
.badge.no { color: var(--off); border: 1px solid var(--line); font-weight: 500; }
.dl { font-size: 13px; font-weight: 600; color: var(--accent); }
.mlabel { display: none; }
.empty { padding: 48px 0; color: var(--muted); text-align: center; }

@media (max-width: 820px) {
  .head { display: none; }
  .row { grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .book { grid-column: 1 / -1; }
  .mlabel { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
  .cell-tags { grid-column: 1 / -1; }
  select { max-width: 100%; }
  .filters label { flex: 1 1 140px; }
  .toolbar { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Lista de libros</h1>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="Buscar por título, autor o de qué trata…" aria-label="Buscar">
    <div class="filters">
      <label for="f-genero">Género<select id="f-genero"></select></label>
      <label for="f-dif">Dificultad<select id="f-dif"></select></label>
      <label for="f-largo">Extensión<select id="f-largo"></select></label>
      <label for="f-tengo">Lo tengo<select id="f-tengo">
        <option value="">Todos</option><option value="si">Sí</option><option value="no">No</option>
      </select></label>
      <label for="f-orden">Ordenar por<select id="f-orden">
        <option value="autor-asc">Autor (A–Z)</option>
        <option value="autor-desc">Autor (Z–A)</option>
        <option value="titulo-asc">Título (A–Z)</option>
        <option value="titulo-desc">Título (Z–A)</option>
        <option value="genero-asc">Género (A–Z)</option>
        <option value="genero-desc">Género (Z–A)</option>
        <option value="dif-asc">Más fácil primero</option>
        <option value="dif-desc">Más difícil primero</option>
        <option value="largo-asc">Más corto primero</option>
        <option value="largo-desc">Más largo primero</option>
        <option value="tengo-desc">Los que tengo primero</option>
        <option value="tengo-asc">Los que me faltan primero</option>
      </select></label>
      <button class="reset" id="reset" type="button">Quitar filtros y orden</button>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
</div>

<main class="wrap">
  <div class="row head" id="head">
    <div><button type="button" class="sort" data-sort="titulo">Libro</button> · <button type="button" class="sort" data-sort="autor">Autor</button></div>
    <div><button type="button" class="sort" data-sort="genero">Género</button></div>
    <div><button type="button" class="sort" data-sort="dif">Dificultad</button></div>
    <div><button type="button" class="sort" data-sort="largo">Extensión</button></div>
    <div><button type="button" class="sort" data-sort="tengo">Lo tengo</button></div>
  </div>
  <div id="list"></div>
</main>

<script src="libros.js"></script>
<script>
(function () {
  var LIBROS = window.LIBROS || [];
  var LARGOS = ["Corto", "Medio", "Largo", "Muy largo"];
  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
  var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };

  LIBROS.forEach(function (b) {
    b.tags = (b.genero || "").split("/").map(function (t) { return cap(t.trim()); }).filter(Boolean);
    b._q = norm([b.titulo, b.autor, b.genero, b.trata].join(" "));
    b._largo = LARGOS.indexOf(b.largo);
  });

  // Estadísticas
  var tengo = LIBROS.filter(function (b) { return b.tengo; }).length;
  var autores = new Set(LIBROS.map(function (b) { return b.autor; })).size;
  $("stats").innerHTML = "<span><b>" + LIBROS.length + "</b> libros</span><span><b>" + autores +
    "</b> autores</span><span><b>" + tengo + "</b> los tengo</span><span><b>" + (LIBROS.length - tengo) + "</b> me faltan</span>";

  // Opciones de filtros
  var tagCount = {};
  LIBROS.forEach(function (b) { b.tags.forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; }); });
  var tags = Object.keys(tagCount).sort(function (a, b) { return a.localeCompare(b, "es"); });
  $("f-genero").innerHTML = '<option value="">Todos</option>' + tags.map(function (t) {
    return '<option value="' + esc(t) + '">' + esc(t) + " (" + tagCount[t] + ")</option>";
  }).join("");
  $("f-dif").innerHTML = '<option value="">Todas</option>' + [1, 2, 3, 4, 5].filter(function (d) {
    return LIBROS.some(function (b) { return b.dificultad === d; });
  }).map(function (d) { return '<option value="' + d + '">' + d + "/5</option>"; }).join("");
  $("f-largo").innerHTML = '<option value="">Todas</option>' + LARGOS.map(function (l) {
    return '<option value="' + l + '">' + l + "</option>";
  }).join("");

  var ids = ["q", "f-genero", "f-dif", "f-largo", "f-tengo", "f-orden"];

  function render() {
    var q = norm($("q").value.trim());
    var g = $("f-genero").value, d = $("f-dif").value, l = $("f-largo").value, t = $("f-tengo").value, o = $("f-orden").value;
    var res = LIBROS.filter(function (b) {
      return (!q || b._q.indexOf(q) !== -1) &&
        (!g || b.tags.indexOf(g) !== -1) &&
        (!d || b.dificultad === +d) &&
        (!l || b.largo === l) &&
        (!t || (t === "si") === b.tengo);
    });
    var key = o.split("-")[0], dir = o.split("-")[1] === "desc" ? -1 : 1;
    var txt = function (k) { return function (a, b) { return a[k].localeCompare(b[k], "es"); }; };
    var main = {
      autor: txt("autor"),
      titulo: txt("titulo"),
      genero: txt("genero"),
      dif: function (a, b) { return (a.dificultad || 0) - (b.dificultad || 0); },
      largo: function (a, b) { return a._largo - b._largo; },
      tengo: function (a, b) { return (a.tengo ? 1 : 0) - (b.tengo ? 1 : 0); }
    }[key];
    res.sort(function (a, b) {
      return dir * main(a, b) || (key === "autor" ? txt("titulo")(a, b) : txt("autor")(a, b) || txt("titulo")(a, b));
    });
    document.querySelectorAll("#head .sort").forEach(function (btn) {
      var on = btn.dataset.sort === key && o !== "autor-asc";
      btn.classList.toggle("active", on);
      btn.classList.toggle("desc", on && dir === -1);
      btn.setAttribute("aria-sort", on ? (dir === 1 ? "ascending" : "descending") : "none");
    });
    $("count").textContent = res.length === LIBROS.length ? "Mostrando los " + res.length + " libros" : res.length + " de " + LIBROS.length + " libros";

    if (!res.length) { $("list").innerHTML = '<p class="empty">Ningún libro coincide con estos filtros.</p>'; return; }
    $("list").innerHTML = res.map(function (b) {
      var dots = "";
      for (var i = 1; i <= 5; i++) dots += '<span class="dot' + (i <= b.dificultad ? " on" : "") + '"></span>';
      var bar = "";
      for (var j = 0; j < 4; j++) bar += "<i" + (j <= b._largo ? ' class="on"' : "") + "></i>";
      return '<article class="row">' +
        '<div class="book"><h2>' + esc(b.titulo) + '</h2>' +
          '<div class="author"><button type="button" data-autor="' + esc(b.autor) + '">' + esc(b.autor) + "</button></div>" +
          (b.trata ? '<p class="trata">' + esc(b.trata) + "</p>" : "") + "</div>" +
        '<div class="cell-tags"><span class="mlabel">Género</span><div class="tags">' + b.tags.map(function (t) {
          return '<button type="button" class="tag" data-tag="' + esc(t) + '">' + esc(t) + "</button>";
        }).join("") + "</div></div>" +
        '<div><span class="mlabel">Dificultad</span><div class="diflabel">' + (b.dificultad ? b.dificultad + "/5" : "—") +
          '</div><div class="dots" aria-hidden="true">' + dots + "</div></div>" +
        '<div><span class="mlabel">Extensión</span><div class="len">' + esc(b.largo || "—") + '</div><div class="lenbar" aria-hidden="true">' + bar + "</div></div>" +
        '<div class="state"><span class="mlabel">Lo tengo</span>' +
          (b.tengo ? '<span class="badge si">Sí</span>' : '<span class="badge no">No</span>') +
          (b.epub ? '<a class="dl" href="' + esc(b.epub) + '" download>Descargar EPUB</a>' : "") + "</div>" +
        "</article>";
    }).join("");
  }

  ids.forEach(function (id) { $(id).addEventListener(id === "q" ? "input" : "change", render); });
  $("reset").addEventListener("click", function () {
    $("q").value = ""; ["f-genero", "f-dif", "f-largo", "f-tengo"].forEach(function (id) { $(id).value = ""; });
    $("f-orden").value = "autor-asc";
    render();
  });
  $("head").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-sort]");
    if (!btn) return;
    var k = btn.dataset.sort, cur = $("f-orden").value.split("-");
    var first = k === "tengo" ? "desc" : "asc";
    $("f-orden").value = k + "-" + (cur[0] === k ? (cur[1] === "asc" ? "desc" : "asc") : first);
    render();
  });
  $("list").addEventListener("click", function (e) {
    var tag = e.target.closest("[data-tag]"), au = e.target.closest("[data-autor]");
    if (tag) { $("f-genero").value = tag.dataset.tag; render(); }
    if (au) { $("q").value = au.dataset.autor; render(); }
    if (tag || au) window.scrollTo({ top: document.querySelector("main").offsetTop - document.querySelector(".toolbar").offsetHeight });
  });
  render();
})();
</script>
</body>
</html>
